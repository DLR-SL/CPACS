[workspace]
name = "cpacs-schema"
description = "Development and validation environment for the CPACS schema"
channels = ["conda-forge", "dlr-sc"]
platforms = ["linux-64", "win-64"]
channel-priority = "strict"
requires-pixi = ">=0.69,<1"

[dependencies]
python = "3.10.*"
pytest = ">=8,<9"
lxml = ">=5,<6"
tomli = ">=2,<3"

# Restrict TIXI explicitly to the DLR-SC channel. Generic dependencies
# should preferably come from conda-forge.
tixi3 = { version = "3.3.0.*", channel = "dlr-sc" }

[tasks]
test-schema = "python scripts/schema_tool.py check schema/cpacs_schema.xsd"
lint-schema = "python scripts/schema_tool.py lint schema/cpacs_schema.xsd"
test-examples = "python -m pytest scripts/tests/test_examples.py -v"
format-schema = "python scripts/schema_tool.py format schema/cpacs_schema.xsd --in-place"

# Run all validation tasks used by CI.
check = { depends-on = ["test-schema", "lint-schema", "test-examples"] }
